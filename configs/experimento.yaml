# Configuração única do experimento P2 de PDI (Gray-Scott), conforme PROTOCOLO.MD da turma.
# Qualquer mudança aqui deve ser registrada no artigo (Seção de Metodologia).
seed: 0
fluido: gray_scott_reaction_diffusion
dataset_variant: "polymathic-ai/gray_scott_reaction_diffusion (Hugging Face, HDF5 oficial)"

# Resolução (protocolo, Seção 3): maior eixo <= 128 px, sem upscaling. O Gray-Scott já é
# 128 x 128, então não há reamostragem (fator 1) nem padding.
resolucao_original: [128, 128]
resolucao_usada: [128, 128]

ground_truth:
  campo: B
  criterio: "B > tau, tau = Otsu global do treino (t > 0)"   # tau lido de results/gt/candidatos.json
entrada: A        # decisão G3: só A entra na rede; o GT vem de B

dados:
  dir: data/processed/exp
  # Orçamento (protocolo, Seção 4): teto de 25 GB. Usamos TODAS as trajetórias de cada split
  # (máxima diversidade de condições iniciais) com frames distribuídos no tempo: ~2,8 GB.
  # Índices de frame (t = 10 * índice, em s). t = 0 é excluído do treino e da avaliação.
  train:
    trajs_por_regime: 160
    frames: [2, 5, 10, 20, 40, 80, 160, 320, 640, 1000]   # início, transiente, meio e fim
  valid:
    trajs_por_regime: 20
    frames: {inicio: 20, fim: 1000, passo: 20}    # t = 200 .. 10000 s (50 frames)
  test:
    trajs_por_regime: 20
    frames: {inicio: 20, fim: 1000, passo: 20}
  visual:                          # tabela visual: t = 0, 2 intermediários e final
    split: test
    traj: 0
    frames: [0, 40, 500, 1000]     # t = 0, 400, 5000, 10000 s

treino:
  epocas: 20              # fixo (protocolo, Seção 7)
  checkpoint: "melhor época pelo Dice de validação (best_model.pt)"
  early_stopping: false
  pretreinado: true       # SegFormer (mit-b0, ImageNet) e Mask2Former (Swin-T, ADE20K); U-Net do zero
  lr: {unet: 0.001, segformer: 0.0002, mask2former: 0.0001}
  weight_decay: 0.0001
  batch: {unet: 16, segformer: 16, mask2former: 16}
  # Mask2Former: pontos amostrados na perda/emparelhamento. O artigo usa 12544 (112^2) para máscaras
  # de 128x128 (entrada de 512 px), ~0,77 ponto por célula; aqui as máscaras têm 32x32 = 1024 células.
  mask2former_pontos: 1024
  perda: "BCE + Dice (U-Net, SegFormer); perda nativa do Mask2Former"
  aumento: "rotações de 90 graus, reflexões e translações circulares (domínio periódico)"
  validacao_por_epoca: 600   # frames de validação (fixos) usados para escolher a melhor época
  workers: 2
